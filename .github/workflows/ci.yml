# CI for setDING on GitHub Actions (ADR-0010, docs/development/git-workflow.md
# section 7).
#
# Runs the test gate (tool/check.sh). During early development it runs only on
# manual dispatch; the local test gate (`make check`) is binding. Re-enable the
# pull_request and push triggers when heading towards version 1 (ADR-0010).
name: CI

on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The runner already has git, curl, unzip, xz, python3 and clang; only
    # Flutter is installed (and cached) by flutter-action.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Flutter version (FLUTTER_VERSION in the Makefile)
        id: flutter
        run: echo "version=$(sed -n 's/^FLUTTER_VERSION *?= *//p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      # The website (ADR-0030) is built by the test gate.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Versions and runner resources
        run: |
          flutter --version
          echo "CPUs: $(nproc)"
          free -h

      - name: Test gate (format, analyze, l10n, tests)
        run: tool/check.sh
