# CI for RealChord on GitHub Actions (ADR-0010, docs/development/git-workflow.md
# section 7).
#
# Runs the test gate (tool/check.sh). During early development it runs only on
# manual dispatch; the local test gate (`make check`) is binding. Re-enable the
# pull_request and push triggers when heading towards version 1 (ADR-0010).
name: CI

on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # tool/ci/Dockerfile: Debian, Node, python3, clang and Flutter. The tag is
      # the Flutter version used for development (FLUTTER_VERSION in the
      # Makefile); build and push a new tag with `make ci-image ci-image-push`.
      # The package is linked to this repository, so GITHUB_TOKEN may pull it.
      image: ghcr.io/tafli/realchord-ci:3.50.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Versions and runner resources
        run: |
          flutter --version
          echo "CPUs: $(nproc)"
          free -h

      - name: Test gate (format, analyze, l10n, tests)
        run: tool/check.sh
