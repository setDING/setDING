# Release builds for setDING (ADR-0021, docs/development/releases.md).
#
# A tag vX.Y.Z on main builds the Linux, Android and Windows release and publishes
# them as a GitHub Release; Obtainium installs and updates the Android app from
# there, the Windows app updates itself from its setup (ADR-0035). A manual run
# (workflow_dispatch) only builds the artifacts (a test build), it publishes
# nothing. The build number is the run number of this workflow (git
# workflow, section 10): releases and test builds share one counter, so the Android
# versionCode grows with every build and identifies it. pubspec.yaml carries no
# build number. Test build files are named with it (setding-0.8.0-build42-…).
# Every asset gets a CycloneDX SBOM next to it (<asset>.cdx.json, ADR-0037),
# generated and checked in its build job and validated in the sbom job; the
# server image gets one as an attestation on ghcr.io.
# The server (ADR-0063) is released as a bundle per architecture (an asset of
# the GitHub Release) and as a multi-platform image on ghcr.io; both are tested
# (also the update from the previous release) before anything is published,
# and the image is pushed only after the GitHub Release exists.
# Google Play (ADR-0067) gets an AAB of the same build, signed with the upload
# key, uploaded to the internal track after the GitHub Release; the owner
# promotes it in the Play Console. The AAB is not a GitHub Release asset.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      flutter: ${{ steps.version.outputs.flutter }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Version (pubspec.yaml) and Flutter version (Makefile)
        id: version
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "flutter=$(sed -n 's/^FLUTTER_VERSION *?= *//p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "Version $version, build number $GITHUB_RUN_NUMBER"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=setding-$version" >> "$GITHUB_OUTPUT"
          else
            echo "name=setding-$version-build$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in app/pubspec.yaml (v$version)"
            exit 1
          fi

      # The release notes are the version's section in CHANGELOG.md: fail before
      # the builds if it is missing or invalid.
      - name: Changelog
        if: github.ref_type == 'tag'
        run: tool/release/changelog.py check --version ${{ steps.version.outputs.version }}

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Same container build as locally (make release-linux, ADR-0019): baseline
      # glibc and the ISA check, independent of the runner's Ubuntu.
      - name: Build (Debian container)
        run: make release-linux RELEASE_NAME=${{ needs.version.outputs.name }} BUILD_NUMBER=$GITHUB_RUN_NUMBER

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            app/build/${{ needs.version.outputs.name }}-linux-x64.tar.gz
            app/build/${{ needs.version.outputs.name }}-linux-x64.AppImage
            app/build/${{ needs.version.outputs.name }}-linux-x64.tar.gz.cdx.json
            app/build/${{ needs.version.outputs.name }}-linux-x64.AppImage.cdx.json
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle distribution, dependencies and build cache. GitHub scopes
      # caches by ref: a tag build can only restore caches written on main, so the
      # action writes only on main (its default) and tag builds read them. A manual
      # test build on main (gh workflow run release.yml --ref main) seeds or
      # refreshes the cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.version.outputs.flutter }}
          cache: true

      # The release key lives only in the repository secrets (created with
      # `make android-keystore`). Obtainium can only update an app signed with the
      # same key, so a tag build without it fails instead of falling back to a
      # throwaway debug key.
      - name: Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The ANDROID_KEYSTORE_* secrets are missing; create them with 'make android-keystore'"
              exit 1
            fi
            echo "::warning::No release key in the secrets; the APK is signed with a throwaway debug key"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # arm64 only (#407): one Dart AOT and native build instead of three (arm, arm64,
      # x64) shortens the build and shrinks the APK. 32-bit ARM and x86
      # devices are not supported by release builds (ADR-0021).
      - name: Build APK
        working-directory: app
        run: |
          flutter config --no-analytics >/dev/null
          flutter build apk --release --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER" \
            --extra-gen-snapshot-options=--print-instructions-sizes-to="$PWD/build/instruction-sizes.json"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/${{ needs.version.outputs.name }}-android.apk"

      # SBOM (ADR-0037): the Gradle release classpath from the CycloneDX Gradle
      # plugin (applied by an init script), then the SBOM of the APK.
      - name: SBOM
        run: |
          apk="${{ needs.version.outputs.name }}-android.apk"
          (cd app/android && ./gradlew -q :app:cyclonedxDirectBom \
            --init-script "$GITHUB_WORKSPACE/tool/sbom/gradle/cyclonedx.init.gradle" \
            -PsbomOutput="$GITHUB_WORKSPACE/app/build/gradle-bom.json")
          tool/sbom.sh generate --platform android --app app --artifact "$apk" \
            --instruction-sizes app/build/instruction-sizes.json \
            --gradle-bom app/build/gradle-bom.json \
            --build "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
          tool/sbom.sh check --sbom "$apk.cdx.json" --artifact "$apk" \
            --version "${{ needs.version.outputs.version }}"

      - name: Signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs setding-*-android.apk | grep -E 'SHA-256|DN'

      # Google Play (ADR-0067): the same build as an AAB, signed with the upload
      # key (`make android-upload-keystore`); Play App Signing re-signs it with
      # the release key, so Play and Obtainium installs update each other.
      # key.properties is replaced, so this comes after everything that needs
      # the release key. Without the upload key there is no AAB and the play
      # job fails, without holding up the GitHub Release.
      - name: Play upload key
        id: upload-key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::warning::No Play upload key in the secrets ('make android-upload-keystore'); no AAB for Google Play"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$PLAY_UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$PLAY_UPLOAD_KEY_ALIAS
          keyPassword=$PLAY_UPLOAD_KEY_PASSWORD
          EOF
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build AAB
        if: steps.upload-key.outputs.present == 'true'
        working-directory: app
        run: |
          flutter build appbundle --release --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/bundle/release/app-release.aab \
            "$GITHUB_WORKSPACE/${{ needs.version.outputs.name }}-android.aab"
          keytool -printcert -jarfile "$GITHUB_WORKSPACE/${{ needs.version.outputs.name }}-android.aab" |
            grep -E 'Owner|SHA256'

      - name: Upload AAB
        if: steps.upload-key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: play
          path: ${{ needs.version.outputs.name }}-android.aab
          if-no-files-found: error

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            ${{ needs.version.outputs.name }}-android.apk
            ${{ needs.version.outputs.name }}-android.apk.cdx.json
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.version.outputs.flutter }}
          cache: true

      - name: Build
        working-directory: app
        shell: bash
        run: |
          flutter config --no-analytics >/dev/null
          flutter build windows --release --build-number "$GITHUB_RUN_NUMBER" \
            --extra-gen-snapshot-options=--print-instructions-sizes-to="$(cygpath -m "$PWD")/build/instruction-sizes.json"

      # Flutter apps need the Visual C++ runtime; ship its DLLs next to the
      # executable so the zip runs on a Windows without the redistributable.
      - name: Package
        shell: pwsh
        run: |
          $name = "${{ needs.version.outputs.name }}-windows-x64"
          $dir = New-Item -ItemType Directory -Path "staging\$name"
          Copy-Item -Recurse "app\build\windows\x64\runner\Release\*" $dir
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $dir
          }
          Compress-Archive -Path $dir -DestinationPath "$name.zip"

      # The setup (ADR-0035): installs per user and updates an existing
      # installation in place; the app downloads and runs it for updates.
      # Inno Setup is on the runner image; installed if a new image lacks it.
      - name: Setup
        shell: pwsh
        run: |
          $name = "${{ needs.version.outputs.name }}-windows-x64"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DSourceDir=$PWD\staging\$name" `
            "/DOutputDir=$PWD" `
            "/DOutputBase=$name-setup" `
            app\windows\installer\setding.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # SBOM (ADR-0037): the zip and the setup ship the same files. Shipped
      # besides the app: the Visual C++ runtime DLLs and, in the setup, the
      # Inno Setup installer and uninstaller.
      - name: SBOM components
        shell: pwsh
        run: |
          $dir = "staging\${{ needs.version.outputs.name }}-windows-x64"
          $runtime = @(foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $file = Get-Item "$dir\$dll"
            [ordered]@{
              type = 'library'
              'bom-ref' = "msvc/$dll"
              name = $dll
              version = $file.VersionInfo.ProductVersion
              description = 'Microsoft Visual C++ Redistributable'
              supplier = @{ name = 'Microsoft Corporation' }
              hashes = @(@{ alg = 'SHA-256'; content = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() })
              licenses = @(@{ license = @{ name = 'Microsoft Visual C++ Redistributable'; url = 'https://visualstudio.microsoft.com/license-terms/' } })
            }
          })
          # ISCC.exe carries no product version; the installer's uninstall
          # entry does (also when installed by choco).
          $innoVersion = $null
          foreach ($root in 'HKLM:\SOFTWARE\WOW6432Node', 'HKLM:\SOFTWARE', 'HKCU:\SOFTWARE') {
            $key = "$root\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
            if (Test-Path $key) { $innoVersion = (Get-ItemProperty $key).DisplayVersion; break }
          }
          if ($innoVersion -notmatch '^[1-9]\d*\.\d+') {
            throw "Inno Setup version not found ('$innoVersion')"
          }
          $inno = [ordered]@{
            type = 'application'
            'bom-ref' = 'innosetup'
            name = 'Inno Setup'
            version = $innoVersion
            description = 'Installer and uninstaller of the setup'
            licenses = @(@{ license = @{ name = 'Inno Setup License'; url = 'https://jrsoftware.org/files/is/license.txt' } })
            externalReferences = @(@{ type = 'website'; url = 'https://jrsoftware.org/isinfo.php' })
          }
          ConvertTo-Json -Depth 8 -InputObject $runtime | Set-Content -Encoding utf8NoBOM sbom-zip.json
          ConvertTo-Json -Depth 8 -InputObject ($runtime + $inno) | Set-Content -Encoding utf8NoBOM sbom-setup.json

      - name: SBOM
        shell: bash
        run: |
          name="${{ needs.version.outputs.name }}-windows-x64"
          common=(--platform windows-x64 --app app --contents "$name.zip"
            --instruction-sizes app/build/instruction-sizes.json
            --build "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA")
          tool/sbom.sh generate "${common[@]}" --artifact "$name.zip" \
            --extra-components sbom-zip.json
          tool/sbom.sh generate "${common[@]}" --artifact "$name-setup.exe" \
            --extra-components sbom-setup.json
          for file in "$name.zip" "$name-setup.exe"; do
            tool/sbom.sh check --sbom "$file.cdx.json" --artifact "$file" \
              --version "${{ needs.version.outputs.version }}"
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            ${{ needs.version.outputs.name }}-windows-x64.zip
            ${{ needs.version.outputs.name }}-windows-x64.zip.cdx.json
            ${{ needs.version.outputs.name }}-windows-x64-setup.exe
            ${{ needs.version.outputs.name }}-windows-x64-setup.exe.cdx.json
          if-no-files-found: error

  # Server bundles for amd64 and arm64 (arm64 runs under QEMU), the image built
  # from each and the update from the previous release, all tested by
  # tool/server-dist/release-test.sh (ADR-0063 §6).
  server:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The previous release tag, for the update test.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.version.outputs.flutter }}
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and test the server bundles and images
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHS: amd64 arm64
          OUT: dist-server
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export SERVER_VERSION="$VERSION"; fi
          tool/server-dist/release-test.sh

      # One SBOM per bundle (ADR-0037): the web client's packages from the
      # source map the release test kept, PocketBase's Go modules, licences
      # from pub.dev and deps.dev.
      - name: SBOMs of the server bundles
        env:
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tool/server-dist/sbom.sh dist-server/main.dart.js.map \
            dist-server/setding-server-"$VERSION"*-linux-*.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: server
          path: |
            dist-server/setding-server-${{ needs.version.outputs.version }}*-linux-*.tar.gz
            dist-server/setding-server-${{ needs.version.outputs.version }}*-linux-*.tar.gz.cdx.json
          if-no-files-found: error

  # Validates every SBOM against the CycloneDX specification (ADR-0037), also
  # for test builds; their content was checked in the build jobs.
  sbom:
    needs: [linux, android, windows, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate
        run: tool/sbom/validate.sh dist/*.cdx.json

  publish:
    if: github.ref_type == 'tag'
    needs: [version, linux, android, windows, server, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Only tags with a suffix (v1.2.0-beta.1) become pre-releases: Obtainium
      # ignores pre-releases by default.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tool/release/changelog.py notes "$VERSION" > release-notes.md
          # The AAB goes to Google Play only (play job).
          rm -f dist/*.aab
          cd dist
          sha256sum -- * > SHA256SUMS
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --title "setDING $VERSION" \
            --notes-file ../release-notes.md --verify-tag "${prerelease[@]}" -- *

  # Google Play (ADR-0067): uploads the AAB to the internal track once the
  # GitHub Release exists; the owner promotes it in the Play Console. The
  # release notes are the version's user notes (whats_new.json, ADR-0041).
  # Needs the service account key PLAY_SERVICE_ACCOUNT_JSON; the variable
  # PLAY_RELEASE_STATUS may set `draft` (required while the app itself is
  # still a draft in the Play Console), default `completed`. The first AAB
  # of the app is uploaded by hand (docs/development/releases.md).
  play:
    if: github.ref_type == 'tag'
    needs: [version, android, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the AAB
        uses: actions/download-artifact@v8
        with:
          name: play
          path: dist-play

      - name: Release notes
        run: tool/release/play_notes.py "${{ needs.version.outputs.version }}" play-notes

      - name: Service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::The PLAY_SERVICE_ACCOUNT_JSON secret is missing (docs/development/releases.md#google-play)"
            exit 1
          fi

      # Pinned to a commit: a third-party action that receives the service
      # account key (v1.1.5).
      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.setding
          releaseFiles: dist-play/${{ needs.version.outputs.name }}-android.aab
          releaseName: ${{ needs.version.outputs.version }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: play-notes

  # The server image, built for amd64 and arm64 from the tested bundles of this
  # release and pushed to ghcr.io once the GitHub Release exists. Final
  # releases are also tagged X.Y and latest. Its SBOM (the bundles' SBOMs and
  # the distroless base, ADR-0037) is attested to the image's digest.
  server-image:
    if: github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # The storage record of the pushed image (the org's Linked Artifacts).
      artifact-metadata: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download the server bundles
        uses: actions/download-artifact@v8
        with:
          name: server
          path: dist-server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/setding-server"
          images="$repo:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            images="$images $repo:${VERSION%.*} $repo:latest"
          fi
          BUNDLES="$(ls dist-server/setding-server-"$VERSION"-linux-*.tar.gz | tr '\n' ' ')" \
            PLATFORMS=linux/amd64,linux/arm64 PUSH=1 IMAGE="$images" \
            tool/server-dist/build-image.sh

      # Only for the SBOM tool (tool/sbom.sh).
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: SBOM of the image
        id: sbom
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/setding-server"
          digest="$(docker buildx imagetools inspect "$repo:$VERSION" --format '{{json .Manifest}}' |
            python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          base="$(sed -n 's/^FROM //p' tool/server-dist/Dockerfile)"
          args=()
          for f in dist-server/setding-server-"$VERSION"-linux-*.tar.gz.cdx.json; do args+=(--bundle-sbom "$f"); done
          tool/sbom.sh generate-image "${args[@]}" --repository "$repo" --digest "$digest" \
            --base "$base" --version "$VERSION" --build "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" \
            --output setding-server-image.cdx.json
          tool/sbom.sh check --sbom setding-server-image.cdx.json --version "$VERSION" \
            --digest "$digest" --artifact-name "$repo:$VERSION"
          tool/sbom/validate.sh setding-server-image.cdx.json
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the SBOM to the image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.sbom.outputs.repo }}
          subject-digest: ${{ steps.sbom.outputs.digest }}
          sbom-path: setding-server-image.cdx.json
          push-to-registry: true
