name: realchord_server
description: >-
  Tests for the RealChord PocketBase schema, access rules and hooks
  (pb_migrations, pb_hooks). They run against a real PocketBase instance;
  lib/pocketbase_harness.dart is also used by the app's integration tests.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  http: ^1.5.0
  http_parser: ^4.1.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
