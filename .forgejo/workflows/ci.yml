# CI for RealChord (ADR-0010, docs/development/git-workflow.md section 7).
# Runs the test gate (tool/check.sh) on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Parallel test processes (tool/check.sh). The runner has 8 vCPUs and 12 GB
  # RAM; one process per visible core can exhaust the memory and hang the run.
  TEST_CONCURRENCY: 6

jobs:
  test:
    runs-on: linux-amd64
    timeout-minutes: 20
    container:
      # tool/ci/Dockerfile: Debian, Node, python3, clang and Flutter. The tag is
      # the Flutter version used for development (FLUTTER_VERSION in the
      # Makefile); build and push a new tag with `make ci-image ci-image-push`.
      image: ghcr.io/tafli/realchord-ci:3.47.9
      # The instance requires sign-in, also for pulling packages. The secret
      # holds a token with the scope package:read (repository settings ->
      # Actions -> Secrets).
      credentials:
        username: factoryd
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    steps:
      - name: Check out
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Versions and runner resources
        run: |
          flutter --version
          echo "CPUs: $(nproc)"
          free -h

      - name: Test gate (format, analyze, l10n, tests)
        run: tool/check.sh
