# CI for RealChord (ADR-0010, docs/development/git-workflow.md section 7).
# Runs the test gate (tool/check.sh) on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Flutter version used for development.
  FLUTTER_VERSION: 3.47.9
  # The runner's container cannot chown extracted files (user namespace
  # remapping); Flutter extracts its artifacts with tar.
  TAR_OPTIONS: --no-same-owner
  # One test process per visible CPU core exhausts the container's memory
  # and hangs the run; two are enough (tool/check.sh).
  TEST_CONCURRENCY: 2

jobs:
  test:
    runs-on: linux-amd64
    timeout-minutes: 20
    container:
      # Debian with git, curl, unzip, xz and python3 (buildpack-deps) plus Node
      # for the checkout action.
      image: node:22-bookworm
    steps:
      - name: Check out
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install build tools
        # clang builds native assets of dependencies (e.g. pdfium_dart).
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends clang >/dev/null

      - name: Install Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics --no-cli-animations >/dev/null
          "$HOME/flutter/bin/flutter" --version

      - name: Test gate (format, analyze, l10n, tests)
        run: tool/check.sh
