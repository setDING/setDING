# Native splash screens of Android and iOS, generated by `make branding`
# (docs/development/branding.md). The web splash is part of web/index.html;
# Windows and Linux show the in-app splash (lib/ui/widgets/logo.dart).
# Colors and layout match SplashScreen in lib/ui/widgets/logo.dart.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121417"
  image: branding/generated/splash-mark.png
  branding: branding/generated/splash-wordmark.png
  branding_dark: branding/generated/splash-wordmark-dark.png
  branding_bottom_padding: 48

  android_12:
    image: branding/generated/splash-mark-android12.png
    color: "#FFFFFF"
    color_dark: "#121417"
    branding: branding/generated/splash-wordmark.png
    branding_dark: branding/generated/splash-wordmark-dark.png

  web: false
  fullscreen: false
