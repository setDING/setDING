<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="setDING – chords and sets for bands.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="setDING">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>setDING</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">

  <!-- Splash while Flutter loads; the same layout as the in-app splash
       (lib/ui/widgets/logo.dart) and the native splash. Images are
       generated by `make branding` (docs/development/branding.md). -->
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash { position: fixed; inset: 0; background: #FFFFFF; }
    #splash .mark { position: absolute; left: 50%; top: 50%; width: 128px;
      height: 128px; transform: translate(-50%, -50%); }
    #splash .wordmark { position: absolute; left: 50%; bottom: 48px;
      width: 200px; transform: translateX(-50%); }
    #splash .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #121417; }
      #splash .light { display: none; }
      #splash .dark { display: block; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="setDING" role="img">
    <img class="mark" src="splash/mark.svg" alt="">
    <img class="wordmark light" src="splash/wordmark.svg" alt="">
    <img class="wordmark dark" src="splash/wordmark-dark.svg" alt="">
  </div>
  <script>
    // Flutter dispatches this event once it has drawn its first frame
    // (the in-app splash, which looks the same).
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    }, { once: true });
  </script>
  <!-- Audio engine of the click (flutter_soloud, ADR-0026): picks the
       AudioWorklet build when the page is cross-origin isolated, else the
       single-threaded one. -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
