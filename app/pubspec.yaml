name: bandchords
description: "BandChords – chords and sets for bands on stage."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.7.1
  chordpro:
    path: ../packages/chordpro
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.4.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.12.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.5.0

flutter:
  generate: true
  uses-material-design: true
