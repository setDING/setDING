name: setding
description: "setDING – chords and sets for bands on stage."
publish_to: 'none'
version: 0.15.0

environment:
  sdk: ^3.14.0

dependencies:
  app_links: ^7.2.2
  archive: ^4.7.1
  chordpro:
    path: ../packages/chordpro
  crypto: ^3.0.8
  cupertino_ui: ^1.1.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_midi_command: ^1.4.0
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_soloud: ^5.3.0
  flutter_svg: ^2.4.0
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  # jni 1.2.0 breaks path_provider_android 2.3.1 on Android: the app hangs on
  # the splash screen (#516). Pinned until a release works again.
  jni: 1.1.2
  # Pinned together with jni (#516).
  jni_flutter: 1.0.4+1
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^3.1.0
  # Pinned like the server (PB_VERSION, ADR-0004); update deliberately.
  pocketbase: 0.26.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Performance measurement on a device (make perf, docs/development/performance.md).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # Starts a real PocketBase with the repository's schema (integration tests).
  setding_server:
    path: ../server
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.9.1
  # Generates the native splash screens (make branding, docs/development/branding.md).
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Embedded in PDF set lists (ADR-0013); SIL OFL 1.1, see NotoSans-OFL.txt.
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSans-OFL.txt
    # "What's new" after an update (ADR-0041), written in the release PR.
    - assets/whats_new.json
  fonts:
    # Wordmark of the logo (lib/ui/widgets/logo.dart).
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
