include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - linux/**
    - lib/data/database.g.dart
    - lib/l10n/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - unawaited_futures
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - prefer_final_locals
