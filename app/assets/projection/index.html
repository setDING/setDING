<!doctype html>
<!--
  The projected page of the lyrics projection (ADR-0068 §5, §8-10).
  Served by ProjectionServer at /p/<token> (full screen) and
  /p/<token>/lower-third (lower third for livestreams). It follows the
  Server-Sent Events of /p/<token>/events and shows what it gets; it has no
  settings of its own besides full screen. Self-contained: no external
  scripts, styles or fonts (the server's Content Security Policy forbids
  them). {{lang}} and {{fullScreen}} are filled in by projectionPage().
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>setDING</title>
<style>
  :root {
    --fg: #fff;
    --bg: #000;
    --dim: rgba(255, 255, 255, 0.62);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    --align: center;
  }
  html.light { --fg: #000; --bg: #fff; --dim: rgba(0, 0, 0, 0.6); }
  html.serif { --font: Georgia, "Noto Serif", "Times New Roman", serif; }
  html.left { --align: left; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
  }
  body { display: flex; flex-direction: column; }
  #stage {
    flex: 1;
    min-height: 0;
    padding: 4vh 5vw;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #content {
    width: 100%;
    max-height: 100%;
    text-align: var(--align);
    line-height: 1.25;
    transition: opacity 150ms ease;
  }
  #content.hidden { opacity: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4vw; align-items: start; }
  .pair.stacked { grid-template-columns: 1fr; gap: 0.6em 0; }
  .second { color: var(--dim); }
  .line { overflow-wrap: break-word; }
  #content.nowrap .line { white-space: nowrap; }
  .gap { height: 0.6em; }
  #next {
    padding: 0 5vw 1vh;
    color: var(--dim);
    font-size: 2.6vh;
    line-height: 1.3;
    text-align: var(--align);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #copyright {
    padding: 0 5vw 2vh;
    color: var(--dim);
    font-size: 1.8vh;
    text-align: var(--align);
  }
  #next:empty, #copyright:empty { display: none; }
  #status {
    position: fixed;
    top: 1.2vh;
    right: 1.2vh;
    width: 1.2vh;
    height: 1.2vh;
    border-radius: 50%;
    background: #e53935;
    opacity: 0;
    transition: opacity 300ms;
  }
  #status.lost { opacity: 0.8; }
  #fullscreen {
    position: fixed;
    right: 2vh;
    bottom: 2vh;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 24px;
    background: rgba(128, 128, 128, 0.35);
    color: var(--fg);
    cursor: pointer;
    opacity: 0;
    transition: opacity 300ms;
  }
  #fullscreen svg { width: 28px; height: 28px; fill: currentColor; }
  body.active #fullscreen { opacity: 1; }
  body:not(.active) { cursor: none; }

  /* Lower third: a band at the bottom on a transparent background. */
  html.lower-third, html.lower-third body { background: transparent; }
  html.lower-third body { justify-content: flex-end; }
  html.lower-third #stage {
    flex: 0 0 auto;
    height: 22vh;
    margin: 0 4vw 4vh;
    padding: 1.5vh 3vw;
    border-radius: 1vh;
    background: rgba(0, 0, 0, 0.62);
    color: #fff;
    position: relative;
  }
  html.lower-third #stage.empty { visibility: hidden; }
  html.lower-third .second { color: rgba(255, 255, 255, 0.68); }
  html.lower-third #copyright {
    position: absolute;
    right: 1.5vw;
    bottom: 0.6vh;
    padding: 0;
    font-size: 1.4vh;
    color: rgba(255, 255, 255, 0.7);
  }
  html.lower-third .pair.stacked { grid-template-columns: 1fr 1fr; gap: 0 3vw; }
  html.lower-third #next, html.lower-third #fullscreen, html.lower-third #status { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="content"></div></div>
<div id="next"></div>
<div id="copyright"></div>
<div id="status"></div>
<button id="fullscreen" type="button" aria-label="{{fullScreen}}" title="{{fullScreen}}">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
</button>
<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var lowerThird = /\/lower-third\/?$/.test(location.pathname);
  if (lowerThird) root.classList.add('lower-third');
  var base = location.pathname.replace(/\/lower-third\/?$/, '').replace(/\/$/, '');

  var stage = document.getElementById('stage');
  var content = document.getElementById('content');
  var next = document.getElementById('next');
  var copyright = document.getElementById('copyright');
  var status = document.getElementById('status');
  // In the lower third the copyright sits in the band, beside the text.
  if (lowerThird) stage.appendChild(copyright);
  var state = { blank: true, lines: [] };

  function lines(list, cls) {
    var box = document.createElement('div');
    if (cls) box.className = cls;
    (list || []).forEach(function (text) {
      var el = document.createElement('div');
      if (text === '') {
        el.className = 'gap';
      } else {
        el.className = 'line';
        el.textContent = text;
      }
      box.appendChild(el);
    });
    return box;
  }

  function applyStyle(style) {
    style = style || {};
    root.classList.toggle('light', style.theme === 'light' && !lowerThird);
    root.classList.toggle('serif', style.font === 'serif');
    root.classList.toggle('left', style.align === 'left');
  }

  // The largest font size at which the content fits the stage.
  function largest(height) {
    // At most an eighth of the screen height, so a short slide does not
    // turn into a few giant words.
    var cap = lowerThird ? height : innerHeight / 8;
    var low = 6, high = Math.max(12, Math.min(height, cap));
    while (high - low > 0.5) {
      var mid = (low + high) / 2;
      content.style.fontSize = mid + 'px';
      // A pixel of slack: widths are fractional, scroll sizes are rounded.
      if (content.scrollHeight <= height + 1 && content.scrollWidth <= content.clientWidth + 1) {
        low = mid;
      } else {
        high = mid;
      }
    }
    return low;
  }

  // Whole lyric lines when the font stays large enough, otherwise lines
  // wrap so a long line does not make the whole slide tiny.
  function fit() {
    var style = getComputedStyle(stage);
    var height = stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    content.classList.add('nowrap');
    var whole = largest(height);
    content.classList.remove('nowrap');
    var wrapped = largest(height);
    if (whole >= wrapped * 0.6) {
      content.classList.add('nowrap');
      content.style.fontSize = whole + 'px';
    } else {
      content.style.fontSize = wrapped + 'px';
    }
  }

  function render() {
    applyStyle(state.style);
    content.textContent = '';
    var show = !state.blank && (state.marker || (state.lines && state.lines.length));
    if (state.marker && !state.blank) {
      content.appendChild(lines([state.marker]));
    } else if (show) {
      if (state.second) {
        var portrait = innerHeight > innerWidth;
        var pair = document.createElement('div');
        pair.className = portrait ? 'pair stacked' : 'pair';
        pair.appendChild(lines(state.lines));
        pair.appendChild(lines(state.second, 'second'));
        content.appendChild(pair);
      } else {
        content.appendChild(lines(state.lines));
      }
    }
    stage.classList.toggle('empty', !show);
    var songShown = show && !state.marker;
    // As written in {copyright}, which usually has its own "©".
    copyright.textContent = songShown && state.copyright ? state.copyright : '';
    next.textContent = songShown && state.next ? state.next.filter(Boolean).join(' / ') : '';
    document.title = songShown && state.title ? state.title : 'setDING';
    fit();
    content.classList.remove('hidden');
  }

  var lostTimer = null;
  function connect() {
    var source = new EventSource(base + '/events');
    source.addEventListener('state', function (event) {
      clearTimeout(lostTimer);
      status.classList.remove('lost');
      try {
        state = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      render();
    });
    source.onopen = function () {
      clearTimeout(lostTimer);
      status.classList.remove('lost');
    };
    // EventSource reconnects on its own; the dot shows a longer drop. The
    // last slide stays on screen meanwhile.
    source.onerror = function () {
      clearTimeout(lostTimer);
      lostTimer = setTimeout(function () { status.classList.add('lost'); }, 3000);
    };
  }

  var resizeTimer = null;
  addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 100);
  });

  // Full screen: a button that shows while the mouse moves, or a double click.
  var idle = null;
  function active() {
    document.body.classList.add('active');
    clearTimeout(idle);
    idle = setTimeout(function () { document.body.classList.remove('active'); }, 2500);
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (root.requestFullscreen) {
      root.requestFullscreen().catch(function () {});
    }
  }
  if (!lowerThird) {
    addEventListener('mousemove', active);
    addEventListener('touchstart', active, { passive: true });
    addEventListener('dblclick', toggleFullscreen);
    document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
  }

  render();
  connect();
})();
</script>
</body>
</html>
